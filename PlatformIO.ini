[platformio]
src_dir = platforms/esp32/src
include_dir = platforms/esp32/include
lib_dir = platforms/esp32/lib
build_dir = .pioenvs

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    -std=c++17
    -I${PROJECT_DIR}/hal
    -I${PROJECT_DIR}/core
lib_deps =
    # Add any required libraries here
    # Example: ESP32Encoder, MPU6050, etc.
monitor_speed = 115200
upload_speed = 921600